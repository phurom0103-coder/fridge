<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>냉장고</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16243D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냉장고">
<style>
  /* 오늘병원 v99와 같은 팔레트 · 같은 부품 */
  :root {
    --head:        #16243D;   /* 헤더 남색 */
    --orange:      #2D5BD7;   /* 강조 파랑 (오늘병원과 이름 맞춤) */
    --orange-dk:   #1E48B4;
    --orange-tint: #E8EFFD;

    --ink:      #141C2B;
    --ink-mid:  #5A6880;
    --ink-dim:  #8B96AA;
    --paper:    #F2F5FA;
    --surface:  #FFFFFF;
    --rule:     #DFE5EF;

    --go:      #1B7A43;
    --go-bg:   #E6F3EA;
    --stop:    #B3261E;
    --stop-bg: #FBEAE8;
    --wait:    #4A5B6E;
    --wait-bg: #EBEFF3;

    --shadow: 0 1px 2px rgba(16,28,50,.05), 0 4px 14px rgba(16,28,50,.07);
    --tabh:   62px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--paper); color: var(--ink);
    font-size: 15px; line-height: 1.45;
    padding-bottom: calc(var(--tabh) + 84px);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--orange-dk); outline-offset: 2px; }

  /* ---------- 상단 ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--head); color: #fff;
    padding: 14px 16px 16px;
    border-radius: 0 0 20px 20px;
  }
  header h1 { margin: 0 0 11px; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  header h1 .num { font-size: 13.5px; font-weight: 600; margin-left: 8px; opacity: .85; font-variant-numeric: tabular-nums; }
  .hbar { display: none; gap: 7px; }
  .hbar.on { display: flex; }
  .hbar input {
    flex: 1; min-width: 0; height: 46px;
    padding: 0 15px; border: none; border-radius: 12px;
    font-size: 16px; font-family: inherit; color: var(--ink); background: #fff;
  }
  .hbar input::placeholder { color: var(--ink-dim); }
  .hbar button { flex: 0 0 auto; height: 46px; padding: 0 18px; border-radius: 12px; font-size: 15px; font-weight: 700; }
  .hnote { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.82); }

  .wrap { padding: 16px 14px 0; }
  section { display: none; } section.on { display: block; }

  /* ---------- 하단 탭 ---------- */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; gap: 4px;
    background: var(--surface); border-top: 1px solid var(--rule);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #tabs button {
    flex: 1; height: 44px; min-width: 0;
    background: none; color: var(--ink-mid); border-radius: 22px;
    font-size: 14px; font-weight: 500; padding: 0;
  }
  #tabs button.on {
    color: var(--orange-dk); font-weight: 700;
    background: var(--orange-tint);
    box-shadow: inset 0 0 0 1.5px var(--orange);
  }
  .tabcnt {
    display: none; margin-left: 5px; font-size: 11px; font-weight: 700;
    background: var(--wait); color: #fff; border-radius: 9px; padding: 1px 6px; vertical-align: 1px;
  }
  .tabcnt.show { display: inline-block; }

  /* ---------- 레코드 카드 ---------- */
  .rec {
    background: var(--surface);
    border-left: 5px solid #D8E0EC;
    border-radius: 13px; box-shadow: var(--shadow);
    padding: 11px 13px 10px; margin-bottom: 8px;
  }
  /* 여유 있는 품목은 표시하지 않는다. 지났거나 임박한 것만 눈에 띄게 */
  .rec.s-over { border-left-color: var(--stop); }
  .rec.s-soon { border-left-color: #E3958F; }
  .rec.tap { cursor: pointer; }
  .rec h2 { margin: 0; font-size: 16.5px; font-weight: 700; letter-spacing: -.02em; }
  .addr { color: var(--ink-mid); font-size: 12.5px; margin-top: 2px; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dbhead { display: flex; align-items: center; gap: 7px; }
  .dbhead .main { flex: 1; min-width: 0; cursor: pointer; }
  .dbhead h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 기한 표시 */
  .tag {
    flex: 0 0 auto; display: inline-block;
    font-size: 12.5px; font-weight: 700; padding: 4px 9px; border-radius: 8px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .tag.over { background: var(--stop); color: #fff; }
  .tag.soon { background: var(--stop-bg); color: var(--stop); }
  .tag.ok   { background: #EDF1F8; color: var(--ink-mid); font-weight: 600; }
  .tag.unk  { background: #EDF1F8; color: var(--ink-dim); font-weight: 600; }
  .newtag { display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 6px;
    background: var(--go-bg); color: var(--go); vertical-align: 2px; letter-spacing: 0.3px; }
  .rec.mini { padding-top: 11px; padding-bottom: 11px; }
  .rec.mini h2 { font-size: 15px; }

  /* 카드 안 작은 단추 (오늘병원 '수정'·'되돌리기'와 같은 모양) */
  .edit {
    flex: 0 0 auto; min-height: 32px; padding: 0 13px; border-radius: 16px;
    background: transparent; box-shadow: inset 0 0 0 1px #D2DBE9;
    color: var(--ink-mid); font-size: 12.5px; font-weight: 600;
  }
  .edit.on { background: var(--orange); color: #fff; box-shadow: none; }

  /* 재료 표시 (오늘병원 동선 카드의 작은 표시와 같은 모양) */
  .kds { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .kd { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 7px; background: #EBF0F7; color: var(--ink-mid); }
  .kd.get { background: var(--go-bg); color: var(--go); }
  button.kd { cursor: pointer; font-family: inherit; }
  button.kd.add { background: var(--surface); box-shadow: inset 0 0 0 1px #D2DBE9; }

  .memo {
    margin-top: 8px; padding: 7px 10px;
    background: var(--orange-tint); border-radius: 9px;
    font-size: 12.5px; white-space: pre-wrap; color: #2C3E63;
  }
  .memo.warn { background: var(--stop-bg); color: var(--stop); font-weight: 600; }
  .box { background: var(--paper); border-radius: 12px; padding: 11px 13px; white-space: pre-wrap; font-size: 14.5px; line-height: 1.6; }

  /* ---------- 완료 (다 씀 · 샀음) ---------- */
  .rec.done { background: #F0F4FA; border-left-color: #D4DDEA; box-shadow: none; opacity: .58; }
  .rec.done h2 { color: var(--ink-mid); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .donehead { display: flex; align-items: center; gap: 10px; }
  .donehead .main { flex: 1; min-width: 0; }
  .undo {
    flex: 0 0 auto; min-height: 34px; padding: 0 14px; border-radius: 17px;
    background: transparent; box-shadow: inset 0 0 0 1px #CAD4E4;
    color: var(--ink-mid); font-size: 13px; font-weight: 600;
  }

  /* ---------- 구분 줄 ---------- */
  .rhead { margin: 17px 3px 7px; font-size: 13px; font-weight: 800; color: var(--ink-mid); letter-spacing: -0.2px; }
  .rhead:first-child { margin-top: 3px; }
  .rhead.warn { color: var(--stop); }
  .rhead .cnt { font-size: 11.5px; font-weight: 600; color: var(--ink-dim); margin-left: 5px; }
  .rhead.flex { display: flex; align-items: center; }
  .rhead .right { margin-left: auto; }

  .more { display: block; width: 100%; text-align: left; margin: 0 0 10px; padding: 9px 3px; background: none;
    color: var(--orange-dk); font-size: 13.5px; font-weight: 700; }

  /* ---------- 버튼 ---------- */
  button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    border: none; border-radius: 11px;
    padding: 10px 16px; background: var(--orange); color: #fff; cursor: pointer;
  }
  button.ghost { background: #E9EFF7; color: var(--ink); }
  button:active { opacity: .68; }
  button, .tap, .main { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .rec.tap:active, .main:active { opacity: .72; }
  textarea { width: 100%; box-sizing: border-box; border: 1.5px solid #D2DBE9; border-radius: 12px; padding: 10px 12px;
    font: inherit; font-size: 16px; line-height: 1.55; background: var(--surface); color: var(--ink); resize: vertical; }
  textarea:focus { border-color: var(--orange); outline: none; }
  .btnline { display: flex; gap: 8px; margin: -4px 0 16px; }
  .btnline .edit { flex: 0 0 auto; }
  .pend { opacity: .6; }
  a.img { display: block; padding: 12px 14px; border-radius: 12px; background: var(--paper); color: var(--orange-dk); font-weight: 700; text-decoration: none; margin-bottom: 8px; }
  button:disabled { opacity: .45; }

  /* ---------- 시트 (화면 전체) ---------- */
  .sheet {
    position: fixed; inset: 0; background: var(--surface);
    z-index: 50; overflow-y: auto; display: none;
    padding: 18px 16px 112px;
    animation: rise .16s ease-out;
  }
  .sheet.on { display: block; }
  @keyframes rise { from { transform: translateY(14px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet h2 { margin: 2px 0 6px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .sheet .sub { color: var(--ink-mid); font-size: 13px; margin-bottom: 18px; }

  label { display: block; margin-bottom: 17px; }
  label span.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-mid); margin-bottom: 7px; }
  input[type=text], input[type=date], input[type=number], select {
    width: 100%; padding: 12px 13px; font-size: 16px;
    border: 1.5px solid var(--rule); border-radius: 12px;
    font-family: inherit; background: var(--surface); color: var(--ink);
  }
  input[type=text]:focus, input[type=date]:focus, input[type=number]:focus, select:focus { border-color: var(--orange); outline: none; }
  input[type=date] { font-variant-numeric: tabular-nums; }
  .two { display: flex; gap: 8px; } .two > label { flex: 1; min-width: 0; }

  .actions {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--rule);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 9px; z-index: 60;
  }
  .actions button { flex: 1; min-height: 50px; font-size: 15px; font-weight: 700; border-radius: 13px; }

  /* 확인 탭 인라인 폼 */
  .inform { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ECF1F7; }
  .inform label { margin-bottom: 11px; }
  .inform button { width: 100%; min-height: 46px; font-weight: 700; }
  .btnrow { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }

  /* ---------- 빈 화면 · 토스트 ---------- */
  .empty { text-align: center; color: var(--ink-mid); padding: 64px 24px; font-size: 14.5px; line-height: 1.7; }
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--tabh) + 88px);
    transform: translateX(-50%);
    background: rgba(20,28,43,.94); color: #fff;
    padding: 11px 19px; border-radius: 22px;
    font-size: 13.5px; display: none; z-index: 100;
    max-width: 88vw; text-align: center; white-space: pre-line; line-height: 1.5;
  }
  /* 되돌리기가 붙는 알림 (오늘병원 '새 판' 알림과 같은 모양) */
  #undoBar {
    display: none; position: fixed; z-index: 60;
    left: 10px; right: 10px; bottom: calc(var(--tabh) + 14px + env(safe-area-inset-bottom));
    background: var(--ink); color: #fff;
    border-radius: 13px; padding: 12px 12px 12px 16px;
    align-items: center; gap: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.28);
    font-size: 13.5px; font-weight: 600;
  }
  #undoBar.on { display: flex; }
  #undoBar span { flex: 1; min-width: 0; }
  #undoBar button { flex: 0 0 auto; min-height: 38px; padding: 0 16px; border-radius: 10px; font-size: 13.5px; font-weight: 700; }
  /* 버전 표시 (오늘병원과 같은 모양) — 누르면 새로고침 */
  .ver {
    text-align: center; font-size: 12.5px; color: var(--ink-mid);
    padding: 15px 0 8px; cursor: pointer; -webkit-user-select: none; user-select: none;
    background: var(--surface); border-radius: 12px; margin-top: 22px;
    box-shadow: inset 0 0 0 1px var(--rule);
  }
  .ver b { display: block; font-size: 14px; font-weight: 700; color: var(--orange-dk); }
  .ver .vsub { display: block; margin-top: 3px; font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  #busy { position: fixed; top: 0; left: 0; height: 3px; background: #7FA2F0; width: 0; z-index: 130; transition: width .4s; }
</style>
</head>
<body>
<div id="busy"></div>

<header>
  <h1><span id="title">냉장고</span><span class="num" id="meta"></span></h1>
  <div class="hbar on" id="bar-fridge">
    <input id="addInput" type="text" list="terms" placeholder="품목 추가 (예: 두부, 계란)" autocomplete="off" enterkeyhint="done">
    <button onclick="addItem()">추가</button>
  </div>
  <div class="hbar" id="bar-recipe">
    <input id="q" type="text" placeholder="재료로 검색 (예: 파, 돼지고기)" autocomplete="off" enterkeyhint="search">
    <button onclick="search()">검색</button>
  </div>
  <div class="hbar" id="bar-shop">
    <input id="shopInput" type="text" list="terms" placeholder="살 것 추가" autocomplete="off" enterkeyhint="done">
    <button onclick="shopAdd()">추가</button>
  </div>
  <div class="hbar" id="bar-check">
    <div class="hnote">사전에 없는 말이에요. 새 품목으로 넣거나, 기존 품목의 다른 이름으로 등록하거나, 무시하세요.</div>
  </div>
</header>

<div class="wrap">
  <section id="tab-fridge" class="on">
    <button class="more" onclick="openAddSheet()">＋ 날짜 직접 넣어 추가 (포장 기한이 있을 때)</button>
    <div id="fridgeList"></div>
  </section>

  <section id="tab-recipe">
    <div id="recipeList"></div>
    <div class="rhead flex" style="margin-top:22px"><button class="edit right" onclick="importNow()">새 레시피 가져오기</button></div>
  </section>

  <section id="tab-shop">
    <div id="shopList"></div>
    <div id="shopDone"></div>
  </section>

  <section id="tab-check">
    <div id="checkList"></div>
    <div class="ver" onclick="location.reload()"><b id="verMain"></b><span class="vsub" id="verSub">서버 확인 중…</span></div>
  </section>
</div>

<div id="tabs">
  <button class="on" data-tab="fridge">냉장고</button>
  <button data-tab="recipe">레시피<span class="tabcnt" id="recCnt"></span></button>
  <button data-tab="shop">장보기<span class="tabcnt" id="shopCnt"></span></button>
  <button data-tab="check">확인<span class="tabcnt" id="checkCnt"></span></button>
</div>

<datalist id="terms"></datalist>
<datalist id="names"></datalist>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<div id="undoBar"><span id="undoMsg"></span><button id="undoBtn">되돌리기</button></div>

<script>
/* ---------- 서버 통신 (JSONP — 오늘병원과 같은 방식) ---------- */
const APP_VER = '1.6';   /* 화면 버전 — 깃허브에 새로 올릴 때마다 올린다 */
const API = 'https://script.google.com/macros/s/AKfycbzbo3lLmxi3JdOXEDKbo847JwDyvei1DiCBIbScZR2vTvOkwKFZ6Ai1WA7OVK4nf9Zx/exec';
let KEY = '';
try { KEY = localStorage.getItem('fridge_key') || ''; } catch (e) {}
(function () {
  const k = new URLSearchParams(location.search).get('k');
  if (k) { KEY = k; try { localStorage.setItem('fridge_key', k); } catch (e) {} }
})();
let S = null, curTab = 'fridge', recLoaded = false, seq = 0;

const READ_FNS = new Set(['apiInit', 'apiSearch', 'apiRecommend', 'apiRecipe', 'apiRecipeImages']);
function call(fn, ...args) {
  if (!KEY) { askKey(); return Promise.reject(new Error('열쇠 없음')); }
  if (!READ_FNS.has(fn)) mutSeq++;
  busy(true);
  return new Promise((res, rej) => {
    const cb = '__fr' + (++seq) + '_' + Date.now();
    const sc = document.createElement('script');
    let done = false;
    const finish = (r, err) => {
      if (done) return; done = true; clearTimeout(timer); busy(false);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (sc.parentNode) sc.parentNode.removeChild(sc);
      if (err) { toast('실패: ' + err, 5200); return rej(new Error(err)); }
      if (r && r.ok) return res(r.data);
      if (r && r.err === 'AUTH') { askKey(true); return rej(new Error('AUTH')); }
      const m = (r && r.err) || '알 수 없는 오류'; toast('실패: ' + m, 5200); rej(new Error(m));
    };
    const timer = setTimeout(() => finish(null, '서버 응답을 받지 못했습니다 (시간 초과)'), 40000);
    window[cb] = r => finish(r, null);
    sc.onerror = () => finish(null, '서버에 연결하지 못했습니다');
    sc.src = API + '?fn=' + encodeURIComponent(fn) + '&key=' + encodeURIComponent(KEY) +
      '&args=' + encodeURIComponent(JSON.stringify(args)) + '&cb=' + cb;
    document.head.appendChild(sc);
  });
}
function askKey(wrong) {
  openSheet('<h2>앱 열쇠 넣기</h2><div class="sub">' + (wrong ? '열쇠가 맞지 않습니다. 다시 넣어 주세요.' : '처음 한 번만 넣으면 됩니다.') +
    '<br>구글시트 \'설정\' 탭의 TOKEN 값입니다.</div>' +
    '<label><span class="lbl">열쇠</span><input type="text" id="kIn" autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
    '<div class="actions"><button onclick="saveKey()">저장</button></div>');
}
function saveKey() {
  const v = document.getElementById('kIn').value.trim(); if (!v) return;
  KEY = v; try { localStorage.setItem('fridge_key', v); } catch (e) {}
  closeSheet(); reload();
}

// ── 공통 ──
let busyN = 0;
function busy(on) { busyN += on ? 1 : -1; const b = document.getElementById('busy'); b.style.width = busyN > 0 ? '70%' : '100%'; if (busyN <= 0) setTimeout(() => b.style.width = '0', 300); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => s ? s.slice(5).replace('-', '/') : '';

let toastTimer = null;
function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms || 2200);
}
let undoTimer = null;
function undoBar(msg, fn) {
  const u = document.getElementById('undoBar');
  document.getElementById('undoMsg').textContent = msg;
  document.getElementById('undoBtn').onclick = () => { u.classList.remove('on'); fn(); };
  u.classList.add('on');
  if (undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(() => u.classList.remove('on'), 6000);
}
function openSheet(html) { const s = document.getElementById('sheet'); s.innerHTML = html; s.classList.add('on'); s.scrollTop = 0; }
function closeSheet() { document.getElementById('sheet').classList.remove('on'); }

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(t) {
  curTab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 'tab-' + t));
  document.querySelectorAll('.hbar').forEach(s => s.classList.toggle('on', s.id === 'bar-' + t));
  document.getElementById('title').textContent = { fridge: '냉장고', recipe: '레시피', shop: '장보기', check: '확인 필요' }[t];
  renderMeta();
  if (t === 'recipe') { markSeen(); renderRecipes(); }
  window.scrollTo(0, 0);
}
function renderMeta() {
  if (!S) return;
  let m = '';
  if (curTab === 'fridge') {
    const a = S.fridge.active, soon = a.filter(o => o.left != null && o.left <= o.alert).length;
    m = a.length + '개' + (soon ? ' · 임박 ' + soon : '');
  } else if (curTab === 'recipe') m = (S.recipes ? S.recipes.length : S.recipeCount) + '개';
  else if (curTab === 'shop') m = S.shop.open.length ? S.shop.open.length + '개' : '';
  else if (curTab === 'check') m = S.checks.length ? S.checks.length + '개' : '';
  document.getElementById('meta').textContent = m;
}

/* 마지막 화면을 기억해 두었다가 앱을 열자마자 보여 주고, 서버 최신값이 오면 바꿔 끼운다 */
function paint() {

  document.getElementById('names').innerHTML = S.names.map(l => '<option value="' + esc(l) + '">').join('');
  renderFridge(); renderShop(); renderCheck(); renderMeta(); renderRecBadge(); renderRecipes();
}
let lastLoad = 0, mutSeq = 0, rlTimer = null;
/* 저장 작업이 다 끝난 뒤 한 번만 새로 불러오기 (화면에서 먼저 바꾼 내용이 잠깐 되돌아가 보이지 않게) */
function reloadSoon() {
  clearTimeout(rlTimer);
  rlTimer = setTimeout(() => { if (busyN > 0) return reloadSoon(); reload(); }, 700);
}
async function reload() {
  lastLoad = Date.now();
  const seq0 = mutSeq;
  let fresh;
  try { fresh = await call('apiInit'); } catch (e) { return; }
  if (mutSeq !== seq0) return reloadSoon();   // 불러오는 사이에 다른 저장이 있었으면 버리고 다시
  S = fresh;
  try { localStorage.setItem('fridge_state', JSON.stringify(S)); } catch (e) {}

}

// ── 냉장고 ──
function status(o) {
  if (o.left == null) return 'unk';
  if (o.left < 0) return 'over';
  return o.left <= o.alert ? 'soon' : 'ok';
}
function ddText(o) {
  if (o.left == null) return '기한 없음';
  if (o.left < 0) return (-o.left) + '일 지남';
  return o.left === 0 ? '오늘까지' : 'D-' + o.left;
}
function fridgeCard(o) {
  const st = status(o);
  return '<div class="rec s-' + st + (o.pend ? ' pend' : '') + '"><div class="dbhead">' +
    '<div class="main" onclick="editItem(\'' + o.id + '\')"><h2>' + esc(o.name) + '</h2><div class="addr">입고 ' + md(o.inDate) +
    (o.due ? ' · 기한 ' + md(o.due) + (o.direct ? ' (포장)' : '') : '') + (o.known ? '' : ' · 사전에 없음') + '</div></div>' +
    '<span class="tag ' + st + '">' + ddText(o) + '</span>' +
    '<button class="edit" data-id="' + o.id + '" data-name="' + esc(o.name) + '" onclick="consume(this.dataset.id,this.dataset.name)">다 씀</button>' +
    '</div></div>';
}
function renderFridge() {
  const a = S.fridge.active;
  const urgent = a.filter(o => ['over', 'soon'].includes(status(o)));
  const rest = a.filter(o => ['ok', 'unk'].includes(status(o)));
  let h = '';
  if (urgent.length) h += '<div class="rhead warn">지금 확인할 것<span class="cnt">' + urgent.length + '</span></div>' + urgent.map(fridgeCard).join('');
  if (rest.length) h += '<div class="rhead">보관 중<span class="cnt">' + rest.length + '</span></div>' + rest.map(fridgeCard).join('');
  document.getElementById('fridgeList').innerHTML = h ||
    '<div class="empty">냉장고가 비어 있어요.<br>"시리야, 냉장고"로 말하거나<br>위에서 추가하세요.</div>';
}
function sortActive() {
  S.fridge.active.sort((a, b) => (a.left == null ? 1e9 : a.left) - (b.left == null ? 1e9 : b.left) || a.name.localeCompare(b.name, 'ko'));
}
/* ── 화면에서 먼저 보여 주기(기다리지 않기)용 계산 — 서버와 같은 규칙 ── */
const dnum = s => { const p = String(s).split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); };
const addDays = (s, n) => new Date((dnum(s) + n) * 86400000).toISOString().slice(0, 10);
function alertOf(inDate, due, days) {
  const sd = S.soonDays;
  if (sd && typeof sd === 'object') {
    const total = due && inDate ? dnum(due) - dnum(inDate) : days;
    if (total == null) return sd.min;
    const a = Math.ceil(Math.max(total, 0) * sd.ratio);
    return Math.max(sd.min, sd.max != null ? Math.min(sd.max, a) : a);
  }
  return sd != null ? sd : 2;
}
function nameOf(w) {
  if (!S.tname) return null;
  const n = String(w).replace(/\s+/g, '').toLowerCase(), cs = [n];
  PARTICLES.forEach(p => { if (n.length > p.length && n.endsWith(p)) cs.push(n.slice(0, -p.length)); });
  for (const c of cs) if (S.tname[c]) return S.tname[c];
  return null;
}
let tmpSeq = 0;
function tempItem(name, inDate, direct) {
  const info = (S.idays || {})[name] || [null, name];
  const due = direct || (info[0] != null ? addDays(inDate, info[0]) : '');
  return { id: 'tmp' + (++tmpSeq), name, inDate, due, left: due ? dnum(due) - dnum(S.today) : null,
    alert: alertOf(inDate, due, info[0]), direct: !!direct, known: true, match: info[1], pend: true };
}
function showTemp(items) {
  if (!items.length) return;
  items.forEach(it => S.fridge.active.push(it)); sortActive(); renderFridge(); renderMeta();
}
async function addItem() {
  const inp = document.getElementById('addInput'), v = inp.value.trim(); if (!v) return;
  inp.blur(); inp.value = '';
  const temps = v.split(/[\s,]+/).map(nameOf).filter(Boolean).map(n => tempItem(n, S.today, ''));
  showTemp(temps);
  if (!temps.length) toast('등록 중…', 8000);
  try {
    const msg = /[\s,]/.test(v) ? await call('apiAddText', v) : (await call('apiAdd', v, S.today, '')).msg;
    if (!temps.length || /확인/.test(msg)) toast(msg, 3200);
    reloadSoon();
  } catch (e) { inp.value = v; reloadSoon(); }
}
function openAddSheet() {
  openSheet('<h2>날짜 넣어 추가</h2><div class="sub">포장에 기한이 적혀 있으면 그 날짜로 알림이 옵니다.</div>' +
    '<label><span class="lbl">품목</span><input type="text" id="aName" list="terms" placeholder="예: 우유"></label>' +
    '<div class="two"><label><span class="lbl">입고일</span><input type="date" id="aIn" value="' + S.today + '"></label>' +
    '<label><span class="lbl">포장 기한</span><input type="date" id="aDue"></label></div>' +
    '<div class="actions"><button class="ghost" onclick="closeSheet()">닫기</button><button onclick="addWithDate()">추가</button></div>');
}
async function addWithDate() {
  const n = document.getElementById('aName').value.trim(); if (!n) return toast('품목을 적어 주세요');
  const inD = document.getElementById('aIn').value || S.today, due = document.getElementById('aDue').value;
  closeSheet();
  const nm = nameOf(n); if (nm) showTemp([tempItem(nm, inD, due)]);
  try { const r = await call('apiAdd', n, inD, due); if (!nm || !r.ok) toast(r.msg, 3200); } catch (e) {}
  reloadSoon();
}
/* 다 씀: 화면에서 먼저 바로 지우고, 서버 저장은 뒤에서 한다 (기다리지 않음) */
const pending = {};
function consume(id, name) {
  if (String(id).startsWith('tmp')) return toast('저장 중이에요. 잠시 뒤에 눌러 주세요');
  const i = S.fridge.active.findIndex(x => x.id === id); if (i < 0) return;
  const item = S.fridge.active.splice(i, 1)[0];
  renderFridge(); renderMeta(); recLoaded = false;
  undoBar(name + ' 다 씀', () => undo(id, item));
  pending[id] = call('apiConsume', id).catch(() => {
    S.fridge.active.push(item); sortActive(); renderFridge(); renderMeta();
  });
}
async function undo(id, item) {
  if (item && !S.fridge.active.some(x => x.id === id)) { S.fridge.active.push(item); sortActive(); renderFridge(); renderMeta(); }
  try { await pending[id]; await call('apiUndo', id); } catch (e) { reloadSoon(); }
}
function editItem(id) {
  if (String(id).startsWith('tmp')) return;
  const o = S.fridge.active.find(x => x.id === id); if (!o) return;
  openSheet('<h2>' + esc(o.name) + '</h2><div class="sub">입고 ' + esc(o.inDate) + (o.due ? ' · 기한 ' + esc(o.due) : '') + '</div>' +
    '<label><span class="lbl">품목 이름 바꾸기 (잘못 인식됐을 때)</span><input type="text" id="eName" list="terms" value="' + esc(o.name) + '"></label>' +
    '<label><span class="lbl">포장에 적힌 기한</span><input type="date" id="eDue" value="' + (o.direct ? esc(o.due) : '') + '"></label>' +
    '<div class="actions"><button class="ghost" onclick="closeSheet()">닫기</button><button onclick="saveItem(\'' + id + '\')">저장</button></div>');
}
async function saveItem(id) {
  const o = S.fridge.active.find(x => x.id === id);
  const name = document.getElementById('eName').value.trim(), due = document.getElementById('eDue').value;
  const rename = name && name !== o.name, redue = due !== (o.direct ? o.due : '');
  closeSheet(); if (!rename && !redue) return;
  // 화면 먼저 바꾸고 저장은 뒤에서
  const nm = rename ? (nameOf(name) || name) : o.name;
  const t = tempItem(nm, o.inDate, due); Object.assign(o, { name: nm, due: t.due, left: t.left, alert: t.alert, direct: !!due, match: t.match, pend: true });
  sortActive(); renderFridge(); renderMeta();
  try {
    if (rename) await call('apiRename', id, name);
    if (redue) await call('apiSetDue', id, due);
    toast('저장됨');
  } catch (e) {}
  reloadSoon();
}

// ── 레시피 (앱 시작 때 받은 레시피로 화면에서 바로 계산 — 기다림 없음) ──
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
document.getElementById('q').addEventListener('input', e => { if (!e.target.value.trim()) renderRecipes(); });
function kds(list, cls) { return list.map(n => '<span class="kd ' + (cls || '') + '">' + esc(n) + '</span>').join(''); }
const PARTICLES = ['이랑', '하고', '에서', '으로', '까지', '이요', '랑', '과', '와', '도', '을', '를', '은', '는', '이', '가', '에', '로', '만', '요', '좀'];
const local = () => !!(S && S.recipes && S.term);
function lookup(w) {
  const n = String(w).replace(/\s+/g, '').toLowerCase(), cs = [n];
  PARTICLES.forEach(p => { if (n.length > p.length && n.endsWith(p)) cs.push(n.slice(0, -p.length)); });
  for (const c of cs) if (S.term[c]) return S.term[c];
  return null;
}
function localSearch(q) {
  const terms = q.split(/[,\s]+/).map(w => w.trim()).filter(Boolean).map(w => ({ word: w, match: lookup(w) }));
  const results = [];
  S.recipes.forEach(r => {
    const set = new Set(r.ings), hay = (r.title + ' ' + r.raw).replace(/\s+/g, '').toLowerCase();
    const hits = terms.filter(t => t.match ? set.has(t.match) : hay.includes(t.word.replace(/\s+/g, '').toLowerCase()));
    if (hits.length) results.push({ id: r.id, title: r.title, hits: hits.map(h => h.match || h.word), full: hits.length === terms.length });
  });
  results.sort((a, b) => (b.full - a.full) || (b.hits.length - a.hits.length) || a.title.localeCompare(b.title, 'ko'));
  return { terms, results };
}
function haveMap() {
  const have = {};
  S.fridge.active.forEach(o => {
    if (S.season[o.match]) return;
    const left = o.left == null ? 1e9 : o.left;
    if (!(o.match in have) || left < have[o.match]) have[o.match] = left;
  });
  return have;
}
function localRecommend() {
  const have = haveMap(), out = [];
  S.recipes.forEach(r => {
    const core = r.ings.filter(m => !S.season[m]), hit = core.filter(m => m in have);
    if (!hit.length) return;
    const soon = Math.min(...hit.map(m => have[m]));
    out.push({ id: r.id, title: r.title, hits: hit, miss: core.filter(m => !(m in have)), soon: soon >= 1e9 ? null : soon });
  });
  out.sort((a, b) => (b.hits.length - a.hits.length) || (a.miss.length - b.miss.length) || ((a.soon ?? 1e9) - (b.soon ?? 1e9)));
  return out.slice(0, 30);
}

/* 새 레시피 표시: 레시피 탭을 열기 전까지 '새로' 배지 */
let seenRec = null, freshNow = new Set();
function loadSeen() {
  if (seenRec) return;
  try { const v = localStorage.getItem('fridge_seen_recipes'); seenRec = new Set(v ? JSON.parse(v) : []); } catch (e) { seenRec = new Set(); }
}
function saveSeen() { try { localStorage.setItem('fridge_seen_recipes', JSON.stringify([...seenRec])); } catch (e) {} }
function unseen() { loadSeen(); return local() ? S.recipes.filter(r => !seenRec.has(r.id)) : []; }
let lastUnseenN = -1;
function renderRecBadge() {
  const n = curTab === 'recipe' ? 0 : unseen().length;
  const c = document.getElementById('recCnt'); c.textContent = n; c.classList.toggle('show', n > 0);
  if (n > Math.max(lastUnseenN, 0)) toast('새 레시피 ' + (n - Math.max(lastUnseenN, 0)) + '개가 들어왔어요 — 레시피 탭에서 보세요', 3600);
  lastUnseenN = n;
}
function markSeen() {
  const u = unseen(); u.forEach(r => { freshNow.add(r.id); seenRec.add(r.id); });
  if (u.length) saveSeen();
  lastUnseenN = 0; renderRecBadge();
}

const recCard = x => '<div class="rec tap' + (x.soon != null && x.soon <= 3 ? ' s-soon' : '') + '" onclick="openRecipe(\'' + x.id + '\')"><h2>' + esc(x.title) +
  (freshNow.has(x.id) ? '<span class="newtag">새로</span>' : '') + '</h2>' +
  '<div class="addr">있는 재료 ' + x.hits.length + (x.miss.length ? ' · 없는 재료 ' + x.miss.length : ' · 바로 가능') +
  (x.soon != null && x.soon <= 3 ? ' · 임박 재료 사용' : '') + '</div>' +
  '<div class="kds">' + kds(x.hits, 'get') + kds(x.miss) + '</div></div>';
const miniCard = r => '<div class="rec tap mini" onclick="openRecipe(\'' + r.id + '\')"><h2>' + esc(r.title) +
  (freshNow.has(r.id) ? '<span class="newtag">새로</span>' : '') + '</h2>' +
  '<div class="addr">' + esc(r.source || '저장한 레시피') + (r.date ? ' · ' + md(r.date) + ' 저장' : '') + '</div></div>';

function renderRecipes() {
  if (curTab !== 'recipe' || document.getElementById('q').value.trim()) return;
  if (!local()) return loadRecommend();   // 서버가 아직 이전 판일 때
  const rec = localRecommend();
  const fresh = S.recipes.filter(r => freshNow.has(r.id));
  const all = S.recipes.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)) || a.title.localeCompare(b.title, 'ko'));
  let h = '';
  if (fresh.length) h += '<div class="rhead">새로 들어온 레시피<span class="cnt">' + fresh.length + '</span></div>' + fresh.map(miniCard).join('');
  h += '<div class="rhead">냉장고 재료로 만들 수 있는 레시피<span class="cnt">' + rec.length + '</span></div>' +
    (rec.length ? rec.map(recCard).join('') : '<div class="empty" style="padding:24px">냉장고 재료와 겹치는 레시피가 없어요.<br>간장·소금 같은 양념은 추천 계산에서 빼요.</div>');
  h += '<div class="rhead">저장한 레시피 전체<span class="cnt">' + all.length + '</span></div>' +
    (all.length ? all.map(miniCard).join('') : '<div class="empty" style="padding:24px">아직 저장한 레시피가 없어요.<br>사진을 \'레시피 저장\' 단축어로 공유하세요.</div>');
  document.getElementById('recipeList').innerHTML = h;
}
async function loadRecommend() {   // 이전 서버용 (v3.3 이하)
  recLoaded = true;
  const r = await call('apiRecommend');
  document.getElementById('recipeList').innerHTML =
    '<div class="rhead">냉장고 재료로 만들 수 있는 레시피<span class="cnt">' + r.length + '</span></div>' + r.map(recCard).join('');
}
async function search() {
  const q = document.getElementById('q').value.trim(); if (!q) return renderRecipes();
  document.getElementById('q').blur();
  const r = local() ? localSearch(q) : await call('apiSearch', q);
  const full = r.results.filter(x => x.full), part = r.results.filter(x => !x.full);
  const card = x => '<div class="rec tap" onclick="openRecipe(\'' + x.id + '\')"><h2>' + esc(x.title) + '</h2><div class="kds">' + kds(x.hits, 'get') + '</div></div>';
  const words = r.terms.map(t => t.match && t.match !== t.word ? t.word + '→' + t.match : t.word).join(', ');
  document.getElementById('recipeList').innerHTML =

    (r.terms.length > 1 && part.length ? '<div class="rhead">일부만 포함<span class="cnt">' + part.length + '</span></div>' + part.map(card).join('') : '');
}
async function openRecipe(id) {

    '<label><span class="lbl">확인 필요 (다 고쳤으면 비우세요)</span>' + ta('uncertain', r.uncertain, 3) + '</label>' +
    '<div class="actions"><button class="ghost" id="delBtn" onclick="deleteRecipe(\'' + r.id + '\')">삭제</button>' +
    '<button class="ghost" onclick="openRecipe(\'' + r.id + '\')">취소</button><button onclick="saveRecipe(\'' + r.id + '\')">저장</button></div>');
}
async function saveRecipe(id) {
  const g = k => document.getElementById('r_' + k).value.trim();
  const v = { title: g('title') || '(제목 없음)', ings: g('ings'), raw: g('raw'), steps: g('steps'), source: g('source'), memo: g('memo'), uncertain: g('uncertain') };
  const r = S.recipes.find(x => x.id === String(id)); if (!r) return;
  const ings = []; v.ings.split(/[,\n]/).map(x => x.trim()).filter(Boolean).forEach(w => { const m = lookup(w) || w; if (!ings.includes(m)) ings.push(m); });
  Object.assign(r, { title: v.title, ings, raw: v.raw, steps: v.steps, source: v.source, memo: v.memo, uncertain: v.uncertain });
  try { localStorage.setItem('fridge_state', JSON.stringify(S)); } catch (e) {}
  openRecipe(id); renderRecipes(); toast('저장됨');
  try { const res = await call('apiRecipeSave', id, v); r.ings = res.ings; } catch (e) { reloadSoon(); }
}
let delArmed = null;
async function deleteRecipe(id) {
  const b = document.getElementById('delBtn');
  if (delArmed !== id) { delArmed = id; b.textContent = '한 번 더 누르면 삭제'; b.style.color = 'var(--stop)'; setTimeout(() => { if (delArmed === id) delArmed = null; }, 4000); return; }
  delArmed = null;
  const i = S.recipes.findIndex(x => x.id === String(id)); if (i < 0) return;
  S.recipes.splice(i, 1); closeSheet(); renderRecipes(); renderMeta(); toast('레시피를 지웠어요');
  try { localStorage.setItem('fridge_state', JSON.stringify(S)); } catch (e) {}
  try { await call('apiRecipeDelete', id); } catch (e) { reloadSoon(); }
}
async function recipeImages(id) {
  toast('원본 사진 찾는 중…', 6000);
  const list = await call('apiRecipeImages', id);
  toast(list.length ? '사진 ' + list.length + '장' : '원본 사진을 찾지 못했어요', 2000);
  if (!list.length) return;
  openSheet('<h2>원본 사진</h2><div class="sub">구글 드라이브에서 열립니다. 이 구글 계정으로 로그인돼 있어야 보여요.</div>' +
    list.map(x => '<a class="img" href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.name) + ' 열기 ›</a>').join('') +
    '<div class="actions"><button class="ghost" onclick="openRecipe(\'' + id + '\')">레시피로 돌아가기</button></div>');
}
async function importNow() {
  const n = await call('apiImportNow');
  toast(n ? '레시피 ' + n + '개를 가져왔습니다' : '새로 가져올 레시피가 없습니다');
  await reload(); if (curTab === 'recipe') { markSeen(); renderRecipes(); }
}

// ── 장보기 ──
function renderShop() {
  const o = S.shop.open.length;
  const c = document.getElementById('shopCnt'); c.textContent = o; c.classList.toggle('show', o > 0);
  document.getElementById('shopList').innerHTML = S.shop.open.map(s =>
    '<div class="rec"><div class="dbhead"><div class="main"><h2>' + esc(s.name) + '</h2><div class="addr">' + esc(s.from) + ' · ' + md(s.added) + '</div></div>' +
    '<button class="edit on" onclick="shopBuy(\'' + s.id + '\')">샀음</button>' +
    '<button class="edit" onclick="shopRemove(\'' + s.id + '\')">삭제</button></div></div>').join('')
    || '<div class="empty">살 것이 없어요.<br>레시피에서 ＋를 누르거나 위에서 추가하세요.</div>';
  document.getElementById('shopDone').innerHTML = S.shop.done.length ? '<div class="rhead">최근 산 것<span class="cnt">냉장고에 자동으로 들어감</span></div>' +
    S.shop.done.map(s => '<div class="rec done"><div class="donehead"><div class="main"><h2>' + esc(s.name) + '</h2><div class="addr">' + md(s.bought) + ' 구매</div></div>' +
      '<button class="undo" onclick="shopUndo(\'' + s.id + '\')">되돌리기</button></div></div>').join('') : '';
}
async function shopAdd() {
  const i = document.getElementById('shopInput'), v = i.value.trim(); if (!v) return;
  i.value = '';
  if (S.shop.open.some(x => x.name === v)) return toast('이미 목록에 있습니다');
  S.shop.open.push({ id: 'tmp' + (++tmpSeq), name: v, added: S.today, from: '직접' }); renderShop(); renderMeta();
  try { await call('apiShopAdd', v, '직접'); } catch (e) {}
  reloadSoon();
}
async function shopBuy(id) {
  if (String(id).startsWith('tmp')) return toast('저장 중이에요. 잠시 뒤에 눌러 주세요');
  const i = S.shop.open.findIndex(x => x.id === id); if (i < 0) return;
  const it = S.shop.open.splice(i, 1)[0]; renderShop(); renderMeta();
  try { const m = await call('apiShopBuy', id); toast(m, 3200); recLoaded = false; reloadSoon(); }
  catch (e) { S.shop.open.splice(i, 0, it); renderShop(); renderMeta(); }
}
async function shopUndo(id) {
  const i = S.shop.done.findIndex(x => x.id === id); if (i < 0) return;
  const it = S.shop.done.splice(i, 1)[0]; it.bought = ''; S.shop.open.push(it); renderShop(); renderMeta();
  toast('장보기로 되돌렸습니다\n냉장고에 들어간 건 냉장고 탭에서 다 씀 처리하세요', 4200);
  try { await call('apiShopUndo', id); } catch (e) {}
  reloadSoon();
}
async function shopRemove(id) {
  if (String(id).startsWith('tmp')) return;
  const i = S.shop.open.findIndex(x => x.id === id); if (i < 0) return;
  const it = S.shop.open.splice(i, 1)[0]; renderShop(); renderMeta();
  try { await call('apiShopRemove', id); } catch (e) { S.shop.open.splice(i, 0, it); renderShop(); renderMeta(); }
}

// ── 확인 ──
function renderCheck() {
  const n = S.checks.length;
  document.getElementById('verSub').textContent = '서버 ' + (S.version || '이전 판') + ' · 알림 ' + (S.soonText || (S.soonDays != null ? S.soonDays + '일 전' : '재료별')) + ' · 누르면 새로고침';
  const c = document.getElementById('checkCnt'); c.textContent = n; c.classList.toggle('show', n > 0);
  const catOpts = S.cats.map(x => '<option>' + esc(x) + '</option>').join('');
  document.getElementById('checkList').innerHTML = n ? S.checks.map(c =>
    '<div class="rec"><h2>' + esc(c.word) + '</h2><div class="addr">' + md(c.date) + ' · "' + esc(c.raw) + '"</div>' +
    '<div class="btnrow">' +
    '<button class="edit on" onclick="toggleForm(\'n' + c.id + '\')">새 품목으로</button>' +
    '<button class="edit" onclick="toggleForm(\'s' + c.id + '\')">다른 이름으로</button>' +
    '<button class="edit" onclick="resolveCheck(\'' + c.id + '\',\'ignore\')">무시</button></div>' +
    '<div class="inform" id="n' + c.id + '" style="display:none">' +
    '<label><span class="lbl">표준명</span><input type="text" id="nn' + c.id + '" value="' + esc(c.word) + '"></label>' +
    '<div class="two"><label><span class="lbl">분류</span><select id="nc' + c.id + '">' + catOpts + '</select></label>' +
    '<label><span class="lbl">기한(일) · 모르면 비움</span><input type="number" id="nd' + c.id + '" inputmode="numeric"></label></div>' +
    '<button onclick="resolveCheck(\'' + c.id + '\',\'new\')">사전에 추가하고 냉장고에 넣기</button></div>' +
    '<div class="inform" id="s' + c.id + '" style="display:none">' +
    '<label><span class="lbl">어떤 품목의 다른 이름인가요?</span><input type="text" id="st' + c.id + '" list="names" placeholder="예: 대파"></label>' +
    '<button onclick="resolveCheck(\'' + c.id + '\',\'syn\')">등록하고 냉장고에 넣기</button></div></div>').join('')
    : '<div class="empty">확인할 것이 없어요.</div>';
}
function toggleForm(id) { const e = document.getElementById(id); e.style.display = e.style.display === 'none' ? 'block' : 'none'; }
async function resolveCheck(id, mode) {
  let p = {};
  if (mode === 'new') p = { name: document.getElementById('nn' + id).value.trim(), cat: document.getElementById('nc' + id).value, days: document.getElementById('nd' + id).value };
  if (mode === 'syn') { p = { target: document.getElementById('st' + id).value.trim() }; if (!S.names.includes(p.target)) return toast('목록에 있는 표준명을 골라 주세요'); }
  // 화면에서 먼저 지우고, 저장은 뒤에서
  const i = S.checks.findIndex(x => x.id === id); if (i < 0) return;
  const it = S.checks.splice(i, 1)[0]; renderCheck(); renderMeta();
  const job = call('apiCheckResolve', id, mode, p);
  if (mode === 'ignore') undoBar('"' + it.word + '" 무시', async () => {
    if (!S.checks.some(x => x.id === id)) { S.checks.splice(Math.min(i, S.checks.length), 0, it); renderCheck(); renderMeta(); }
    try { await job; await call('apiCheckUndo', id); } catch (e) { reloadSoon(); }
  });
  else toast('저장 중…');
  try {
    const m = await job;
    if (mode !== 'ignore') { toast(m, 3200); recLoaded = false; reloadSoon(); }
  } catch (e) { S.checks.splice(i, 0, it); renderCheck(); renderMeta(); }
}

document.getElementById('addInput').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
document.getElementById('shopInput').addEventListener('keydown', e => { if (e.key === 'Enter') shopAdd(); });
document.getElementById('verMain').textContent = '냉장고 v' + APP_VER;
/* 시리로 넣고 앱으로 돌아오면 자동으로 새로 불러옴 */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && KEY && Date.now() - lastLoad > 3000) reload();
});
if (KEY) {
  try { const c = JSON.parse(localStorage.getItem('fridge_state') || 'null'); if (c && c.fridge) { S = c; paint(); } } catch (e) {}
  reload();
} else askKey();
</script>
